name: Obsession source qualification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: obsession-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-process-tests:
    # Public repository standard GitHub-hosted runner: no paid larger runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OBSESSION_DEPS_ROOT: ${{ runner.temp }}/obsession-deps
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out exact workflow ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify pinned public dependency source blobs
        run: python3 fetch_dependencies.py --directory "$OBSESSION_DEPS_ROOT"

      - name: Run offline source unit tests
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run independent synthetic process acceptance
        run: python3 -B tests/verify_process_acceptance.py
